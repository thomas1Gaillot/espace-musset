version: "3"

tasks:
  dev:
    desc: Lancer le serveur de développement
    cmds:
      - pnpm dev

  push:
    desc: Préparer le code pour la production et pousser sur main (task push MSG="Mon commit")
    vars:
      MSG: ""
    cmds:
      - pnpm format
      - pnpm lint:fix
      - pnpm build
      - git add .
      - |
        if [ -z "{{.MSG}}" ]; then
          git commit -m "Auto commit"
        else
          git commit -m "{{.MSG}}"
        fi
      - git push origin main
