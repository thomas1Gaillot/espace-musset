version: "3"

tasks:
  dev:
    desc: Lancer le serveur de développement
    cmds:
      - pnpm dev

  push:
    desc: Préparer le code pour la production et pousser sur main (task push MSG="Mon commit")
    vars:
      MSG: "Auto commit"
    cmds:
      - pnpm format
      - pnpm lint:fix
      - pnpm build
      - git add .
      - git commit -m "{{.MSG}}"
      - git push origin main
